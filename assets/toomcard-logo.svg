<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Icon -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1132" />
      <stop offset="50%" stop-color="#0c0717" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="logoBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="logoMetalGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Text Gradient for "CARD" -->
    <linearGradient id="textCardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark (48x48) -->
  <g transform="translate(6, 6)">
    <!-- Ambient Glow -->
    <circle cx="24" cy="24" r="20" fill="#a855f7" opacity="0.25" filter="url(#logoGlow)" />
    <!-- Squircle Badge -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#logoBgGrad)" stroke="url(#logoBorderGrad)" stroke-width="1.8" />
    <!-- Inset Rim -->
    <rect x="3" y="3" width="42" height="42" rx="11" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- 3D "T" Symbol -->
    <!-- Shadow facet -->
    <path d="M 10 14 L 38 14 L 38 21 L 28.5 21 L 28.5 40 L 19.5 40 L 19.5 21 L 10 21 Z" fill="#334155" opacity="0.8" />
    <!-- Front facet -->
    <path d="M 11 13 C 11 12 12 11.5 13 11.5 L 35 11.5 C 36 11.5 37 12 37 13 L 37 18.5 C 37 19.5 36 20 35 20 L 27.5 20 L 27.5 38.5 C 27.5 39.5 26.5 40 25.5 40 L 22.5 40 C 21.5 40 20.5 39.5 20.5 38.5 L 20.5 20 L 13 20 C 12 20 11 19.5 11 18.5 Z" fill="url(#logoMetalGrad)" />
    <!-- Accents -->
    <circle cx="35" cy="14" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Typography Wordmark -->
  <!-- "TOOM" in Bold Metallic White -->
  <text x="68" y="38" font-family="'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="#ffffff">TOOM</text>
  
  <!-- "CARD" in Neon Purple/Pink Gradient -->
  <text x="146" y="38" font-family="'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="1.5" fill="url(#textCardGrad)">CARD</text>

  <!-- "3D PLATFORM" Mini Pill Badge -->
  <g transform="translate(216, 21)">
    <rect x="0" y="0" width="56" height="18" rx="9" fill="rgba(255, 217, 120, 0.12)" stroke="rgba(255, 217, 120, 0.35)" stroke-width="1" />
    <text x="28" y="12.5" font-family="'Pretendard', sans-serif" font-weight="800" font-size="9" fill="#ffd978" text-anchor="middle" letter-spacing="0.5">3D SaaS</text>
  </g>
</svg>
