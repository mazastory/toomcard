<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1132" />
      <stop offset="50%" stop-color="#0c0717" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="metalGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Bevel Shadow Gradient -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Neon Backlight -->
  <circle cx="50" cy="50" r="38" fill="#a855f7" opacity="0.18" filter="url(#purpleGlow)" />

  <!-- Badge Body (Squircle) -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Metallic Inset Rim -->
  <rect x="10" y="10" width="80" height="80" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />

  <!-- 3D Dimensional "T" Emblem -->
  <!-- Top Bar Left Bevel Shadow -->
  <path d="M 22 28 L 78 28 L 78 40 L 59 40 L 59 80 L 41 80 L 41 40 L 22 40 Z" fill="url(#shadowGrad)" />

  <!-- Top Bar Front Facet with Sleek Chamfers -->
  <path d="M 24 26 C 24 24.5 25.5 23 27 23 L 73 23 C 74.5 23 76 24.5 76 26 L 76 36 C 76 37.5 74.5 39 73 39 L 58 39 L 58 77 C 58 78.5 56.5 80 55 80 L 45 80 C 43.5 80 42 78.5 42 77 L 42 39 L 27 39 C 25.5 39 24 37.5 24 36 Z" fill="url(#metalGrad)" />

  <!-- High-Tech Inner Glow Accent (Interlocking Cutout) -->
  <path d="M 28 27 L 72 27 L 72 35 L 54 35 L 54 76 L 46 76 L 46 35 L 28 35 Z" fill="none" stroke="#d8b4fe" stroke-width="1" opacity="0.6" />

  <!-- Dynamic Cybernetic Accent Corner Pip -->
  <circle cx="73" cy="27" r="2.2" fill="#38bdf8" filter="url(#purpleGlow)" />
  <circle cx="27" cy="35" r="1.8" fill="#ec4899" />
</svg>
